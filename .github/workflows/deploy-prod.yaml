name: Deploy to prod

on:
  workflow_dispatch:

jobs:
  deploy_to_prod:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          APP_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/fastapi-prod:0.1
          CONTAINER_NAME: fastapi-prod
        run: |
          docker build -t "$APP_IMAGE" .
          docker tag "$APP_IMAGE" "${DOCKERHUB_USERNAME}/fastapi-prod:latest"
          docker push "$APP_IMAGE"
          docker push "${DOCKERHUB_USERNAME}/fastapi-prod:latest"

      - name: Create .env and copy files to server
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_USER }}
          RABBITMQ_DEFAULT_USER: ${{ secrets.RABBITMQ_DEFAULT_USER }}
          RABBITMQ_DEFAULT_PASS: ${{ secrets.RABBITMQ_DEFAULT_PASS }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          APP_IMAGE: ${{ secrets.DOCKERHUB_USERNAME}}/fast-api-prod:latest
          APP_PUBLIC_PORT: ${{secrets.APP_PUBLIC_PORT}}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts

          cat <<EOF > .env
          POSTGRES_USER=$POSTGRES_USER
          POSTGRES_PASSWORD=$POSTGRES_USER
          RABBITMQ_DEFAULT_USER=$RABBITMQ_DEFAULT_USER
          RABBITMQ_DEFAULT_PASS=$RABBITMQ_DEFAULT_PASS
          REDIS_PASSWORD=$REDIS_PASSWORD
          APP_IMAGE=$APP_IMAGE
          APP_PUBLIC_PORT=$APP_PUBLIC_PORT
          EOF

          ssh "$SSH_USER@SSH_HOST" "mkdir -p ~/app"
          scp docker-compose.yaml .env "$SSH_USER@SSH_HOST:~/app/"
