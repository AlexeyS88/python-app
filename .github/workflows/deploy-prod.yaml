name: Deploy to prod

on:
  workflow_dispatch:

jobs:
  deploy_to_prod:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Prepare .env file
        run: cp .env.example .env

      - name: Remove previous deploy
        run: docker compose -p fastapi-prod down -v

      - name: Deploy Project
        run: APP_PUBLIC_PORT=18002 docker compose -p fastapi-prod up -d --build
