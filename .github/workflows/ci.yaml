name: CI
on:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Prepare .env file
        run: cp .env.example .env

      - name: Build app
        env:
          APP_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/fastapi-dev
        run: docker compose -p fastapi-app up -d --build

      - name: Run tests
        run: docker compose exec -T backend pytest -v

      - name: Stop containers
        if: always()
        run: docker compose -p fastapi-app down -v
