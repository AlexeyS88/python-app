name: Deploy to test

on:
  workflow_dispatch:

jobs:
  deploy_to_test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Prepare .env file
        run: cp .env.example .env

      - name: Remove previous deploy
        run: docker compose -p fastapi-test down -v

      - name: Deploy Project
        run: APP_PUBLIC_PORT=18001 docker compose -p fastapi-test up -d --build
